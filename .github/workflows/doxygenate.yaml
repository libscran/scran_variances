on:
  push:
    branches:
      - master

name: Build documentation

jobs:
  doxygenator:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Add Pretty CSS
      run: curl -L https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/main/doxygen-awesome.css > docs/doxygen-awesome.css 

    - name: Download tatami tagfile
      run: curl -L https://tatami-inc.github.io/tatami/tatami.tag > docs/tatami.tag 

    - name: Download tatami tagfile
      run: curl -L https://libscran.github.io/WeightedLowess/WeightedLowess.tag > docs/WeightedLowess.tag 

    - name: Download blocks tagfile
      run: curl -L https://libscran.github.io/scran_blocks/scran_blocks.tag > docs/scran_blocks.tag 

    - name: Doxygen Action
      uses: mattnotmitt/doxygen-action@v1
      with:
        working-directory: docs/

    - name: GH Pages Deployment
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: docs/html
        target-folder: docs/
        clean: true # Automatically remove deleted files from the deploy branch
